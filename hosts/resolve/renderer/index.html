<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <!-- Strict CSP: only local scripts/styles; images from https (Notion files / icons). No network access from the renderer. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; font-src 'self'; connect-src 'none'; media-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notion Companion for Editors</title>
    <link rel="stylesheet" href="styles.css">
    <script src="ui.bundle.js" defer></script>
</head>
<body>
    <div id="app">
        <header id="header"></header>
        <main id="body"><div class="boot">Chargement…</div></main>
        <div id="toast" role="status" aria-live="polite"></div>
    </div>
</body>
</html>
