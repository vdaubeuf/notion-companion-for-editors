# Pushing a tag such as v0.1.0 builds the macOS and Windows installer archives
# and publishes them as a GitHub Release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches plugin version
        run: |
          version=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' plugin/package.json | head -1)
          manifest=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' plugin/manifest.xml)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "plugin/package.json version ($version) != tag ($GITHUB_REF_NAME)"; exit 1; }
          test "$version" = "$manifest" || { echo "manifest.xml version ($manifest) != $version"; exit 1; }

      - name: Build installer archives
        run: ./scripts/package.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Notion Companion $GITHUB_REF_NAME" \
            --notes-file <(awk -v v="## ${GITHUB_REF_NAME#v}" 'index($0, v) == 1 { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md)
