# A tag such as v0.2.0 builds the macOS and Windows installer archives
# (Resolve + Premiere) and the Premiere .ccx, and publishes them as a GitHub Release.
# The tag can be pushed, or created on GitHub with "Draft a new release": the files are then added to that release.
name: Release

on:
  push:
    tags: ['v*']
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches plugin version
        run: |
          version=$(sed -n "s/.*PLUGIN_VERSION: *'\([^']*\)'.*/\1/p" core/constants.js | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "core/constants.js version ($version) != tag ($GITHUB_REF_NAME)"; exit 1; }

      - name: Build installer archives
        run: ./scripts/package.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Notion Companion for Editors $GITHUB_REF_NAME"
          awk -v v="## ${GITHUB_REF_NAME#v}" 'index($0, v) == 1 { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md > notes.md
          case "$GITHUB_REF_NAME" in *-*) pre=true ;; *) pre=false ;; esac
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/*.ccx --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file notes.md --prerelease="$pre"
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.ccx --title "$title" --notes-file notes.md \
              $($pre && echo --prerelease)
          fi
